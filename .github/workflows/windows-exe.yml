name: Ejecutable Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorder-exe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  encoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: third_party/ffmpeg
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mirror/x264
          ref: 31e19f92f00c7003fa115047ce50978bc98c3a0d
          path: third_party/x264
          persist-credentials: false
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix nasm make pkg-config
      - run: bash scripts/build_minimal_ffmpeg.sh
      - name: Include exact encoder sources
        run: |
          mkdir encoder-sources
          git -C third_party/ffmpeg archive HEAD > encoder-sources/ffmpeg.tar
          git -C third_party/x264 archive HEAD > encoder-sources/x264.tar
          cp scripts/build_minimal_ffmpeg.sh encoder-sources/
          cp vendor/encoder/*LICENSE.txt encoder-sources/
          tar -czf vendor/encoder/encoder-sources.tar.gz encoder-sources
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-windows-encoder
          path: vendor/encoder/
          retention-days: 30
          if-no-files-found: error
  build:
    needs: encoder
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: minimal-windows-encoder
          path: vendor/encoder
      - name: Prepare video recorder (no browser download)
        run: python -m playwright install ffmpeg
      - run: python recorder.py check-chrome
      - run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm AgencyKeyRecorderTests.spec
      - name: Test EXE without Python commands
        run: python scripts/smoke_exe.py dist/AgencyKeyRecorderTests.exe
      - name: Preserve tested executable
        uses: actions/upload-artifact@v4
        with:
          name: AgencyKeyRecorderTests-Windows
          path: |
            dist/AgencyKeyRecorderTests.exe
            LEEME-EXE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish private download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "recorder-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            dist/AgencyKeyRecorderTests.exe LEEME-EXE.txt vendor/encoder/encoder-sources.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AgencyKey Recorder Tests · Chrome ligero ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md --latest
