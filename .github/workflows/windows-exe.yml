name: Ejecutable Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorder-exe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Install test browser
        shell: bash
        run: |
          if ! python -m playwright install chromium; then
            PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST=https://storage.googleapis.com/chrome-for-testing-public python -m playwright install chromium
          fi
      - run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm AgencyKeyRecorderTests.spec
      - name: Test EXE without Python commands
        run: python scripts/smoke_exe.py dist/AgencyKeyRecorderTests.exe
      - name: Preserve tested executable
        uses: actions/upload-artifact@v4
        with:
          name: AgencyKeyRecorderTests-Windows
          path: |
            dist/AgencyKeyRecorderTests.exe
            LEEME-EXE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish private download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "recorder-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            dist/AgencyKeyRecorderTests.exe LEEME-EXE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AgencyKey Recorder Tests · Windows ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md --latest
