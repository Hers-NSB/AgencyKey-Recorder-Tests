name: Compilar diagnóstico de perfil
on:
  push:
    branches: [diagnostico-perfil]
    paths:
      - diagnostico/diagnostico_perfil.py
      - .github/workflows/diagnostico-perfil.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "playwright>=1.51,<2" "pyinstaller==6.22.3"
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name AgencyKeyDiagnosticoPerfil diagnostico/diagnostico_perfil.py
      - shell: pwsh
        run: |
          $app = Start-Process dist/AgencyKeyDiagnosticoPerfil.exe -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(90000)) {
            taskkill /PID $app.Id /T /F
            throw "La prueba del EXE excedió el tiempo de espera."
          }
          if ($app.ExitCode -ne 0) { throw "El EXE devolvió $($app.ExitCode)." }
      - uses: actions/upload-artifact@v4
        with:
          name: AgencyKeyDiagnosticoPerfil
          path: dist/AgencyKeyDiagnosticoPerfil.exe
          if-no-files-found: error
# Compilación del diagnóstico independiente
