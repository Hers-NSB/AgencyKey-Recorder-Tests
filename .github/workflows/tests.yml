name: Pruebas sin cuentas reales
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Install browser
        shell: bash
        run: |
          if ! python -m playwright install chromium; then
            PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST=https://storage.googleapis.com/chrome-for-testing-public python -m playwright install chromium
          fi
      - run: python -m unittest discover -s tests -v
      - run: python recorder.py demo --headless
