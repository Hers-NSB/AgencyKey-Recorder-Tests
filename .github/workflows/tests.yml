name: Pruebas sin cuentas reales
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Prepare video recorder (no browser download)
        run: python -m playwright install ffmpeg
      - run: python recorder.py check-chrome
      - run: python -m unittest discover -s tests -v
      - run: python recorder.py demo --headless
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix cloudflare
      - run: node --test cloudflare/worker.test.mjs cloudflare/recording-session.test.mjs
      - run: node --test cloudflare/admin.test.mjs


